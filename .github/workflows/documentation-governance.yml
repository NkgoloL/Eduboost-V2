name: Documentation Governance

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/documentation/**"
      - "scripts/maintenance/**"
      - "Makefile"
      - ".gitattributes"
      - ".github/workflows/documentation-governance.yml"
  push:
    branches: [master, main]
    paths:
      - "**/*.md"
      - "docs/documentation/**"
      - "scripts/maintenance/**"
      - "Makefile"
      - ".gitattributes"
      - ".github/workflows/documentation-governance.yml"
  workflow_dispatch:

jobs:
  docs-housekeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentation housekeeping check
        run: make docs-housekeeping-check
      - name: Stage 3 strict tranche check
        run: make docs-housekeeping-stage3-check
      - name: Stage 4 strict tranche check
        run: make docs-housekeeping-stage4-check
      - name: Stage 5 strict tranche check
        run: make docs-housekeeping-stage5-check
