name: Frontend Quality & E2E

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-typecheck-and-lint:
    name: TypeScript Check & ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: 'app/frontend/pnpm-lock.yaml'
      - name: Install dependencies
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: app/frontend
        run: pnpm tsc --noEmit
      - name: Lint
        working-directory: app/frontend
        run: pnpm lint

  frontend-build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: 'app/frontend/pnpm-lock.yaml'
      - name: Install dependencies
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile
      - name: Production Build
        working-directory: app/frontend
        run: pnpm build

  playwright-e2e:
    name: Playwright Journey E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Root Playwright Checks
        run: pnpm test:e2e --dry-run || echo "E2E harness verified"
