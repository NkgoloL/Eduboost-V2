name: KG Roadmap Closure Report

on:
  pull_request:
    paths:
      - "scripts/knowledge_graph/audit_kg_roadmap_closure.py"
      - "scripts/roadmap_reconciliation/capture_kg_roadmap_closure_evidence.py"
      - "scripts/roadmap_reconciliation/verify_kg_roadmap_closure.py"
      - "docs/roadmap/knowledge_graph/kg_roadmap_closure**"
      - "tests/unit/roadmap_reconciliation/test_kg_roadmap_closure.py"
  workflow_dispatch:

jobs:
  kg-roadmap-closure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Verify KG roadmap closure authority
        run: |
          python3 -m py_compile \
            scripts/knowledge_graph/audit_kg_roadmap_closure.py \
            scripts/roadmap_reconciliation/capture_kg_roadmap_closure_evidence.py \
            scripts/roadmap_reconciliation/verify_kg_roadmap_closure.py
          PYTHONPATH=. python3 scripts/roadmap_reconciliation/verify_kg_roadmap_closure.py --authority-only --json
