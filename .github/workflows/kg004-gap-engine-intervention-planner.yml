name: KG-4 Gap Engine and Intervention Planner

on:
  pull_request:
    paths:
      - "app/domain/knowledge_graph_gap_engine.py"
      - "scripts/knowledge_graph/**kg004**"
      - "scripts/roadmap_reconciliation/**kg004**"
      - "tests/unit/roadmap_reconciliation/test_kg004_gap_engine_intervention_planner.py"
      - "docs/knowledge_graph/gap_engine/**"
      - "docs/roadmap/knowledge_graph/kg_004_gap_engine_intervention_planner*"
      - ".github/workflows/kg004-gap-engine-intervention-planner.yml"
  push:
    branches: [master]
    paths:
      - "app/domain/knowledge_graph_gap_engine.py"
      - "scripts/knowledge_graph/**kg004**"
      - "scripts/roadmap_reconciliation/**kg004**"
      - "tests/unit/roadmap_reconciliation/test_kg004_gap_engine_intervention_planner.py"
      - "docs/knowledge_graph/gap_engine/**"
      - "docs/roadmap/knowledge_graph/kg_004_gap_engine_intervention_planner*"
      - ".github/workflows/kg004-gap-engine-intervention-planner.yml"

jobs:
  kg004-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile KG-4 scripts
        run: |
          python3 -m py_compile             app/domain/knowledge_graph_gap_engine.py             scripts/knowledge_graph/build_kg004_gap_engine_intervention_planner.py             scripts/knowledge_graph/audit_kg004_gap_engine_intervention_planner.py             scripts/roadmap_reconciliation/capture_kg004_gap_engine_intervention_planner_evidence.py             scripts/roadmap_reconciliation/verify_kg004_gap_engine_intervention_planner.py
      - name: Run KG-4 focused tests
        run: PYTHONPATH=. python3 -m pytest -q tests/unit/roadmap_reconciliation/test_kg004_gap_engine_intervention_planner.py --no-cov
      - name: Verify KG-4 authority
        run: PYTHONPATH=. python3 scripts/roadmap_reconciliation/verify_kg004_gap_engine_intervention_planner.py --authority-only --json
