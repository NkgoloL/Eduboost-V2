name: PR Core Quality Gates

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-and-lint:
    name: Compile & Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Python Compileall
        run: python3 -m compileall -q app tests scripts alembic
      - name: Ruff Check
        run: python3 -m ruff check app tests scripts
      - name: Test Import Integrity Audit
        run: PYTHONPATH=. python3 scripts/audit_test_imports.py
      - name: Pytest Blanket Test Collection Gate
        run: PYTHONPATH=. python3 -m pytest --collect-only -q


  mypy-typecheck:
    name: Mypy Static Type Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Mypy Check Core Application
        run: python3 -m mypy app


  unit-tests:
    name: Core Unit Test Suite & Coverage Floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Run Core Unit Tests with Coverage Floor
        run: PYTHONPATH=. python3 -m pytest tests/unit/ -q --maxfail=10



  route-contract-audit:
    name: Route & OpenAPI Canonical Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Check OpenAPI Drift
        run: python3 scripts/generate_openapi.py --check
      - name: Verify Route Inventory & Current State
        run: PYTHONPATH=. python3 scripts/maintenance/generate_current_state_docs.py
