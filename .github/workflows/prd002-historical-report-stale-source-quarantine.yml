name: PRD-0.2 Historical Report Stale Source Quarantine

on:
  pull_request:
    paths:
      - 'docs/reports/**'
      - 'docs/roadmap/production_readiness/**'
      - 'scripts/production_readiness/audit_prd002_historical_report_stale_source_quarantine.py'
      - 'scripts/roadmap_reconciliation/verify_prd002_historical_report_stale_source_quarantine.py'
      - 'scripts/roadmap_reconciliation/capture_prd002_historical_report_stale_source_quarantine_evidence.py'
      - 'tests/unit/roadmap_reconciliation/test_prd002_historical_report_stale_source_quarantine.py'
      - '.github/workflows/prd002-historical-report-stale-source-quarantine.yml'
  push:
    branches: [master]

jobs:
  verify-prd002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements/dev.txt
      - name: Verify PRD-0.2 authority
        run: |
          python3 -m py_compile             scripts/production_readiness/audit_prd002_historical_report_stale_source_quarantine.py             scripts/roadmap_reconciliation/capture_prd002_historical_report_stale_source_quarantine_evidence.py             scripts/roadmap_reconciliation/verify_prd002_historical_report_stale_source_quarantine.py
          PYTHONPATH=. python3 -m pytest -q             tests/unit/roadmap_reconciliation/test_prd002_historical_report_stale_source_quarantine.py             --no-cov
          PYTHONPATH=. python3             scripts/roadmap_reconciliation/verify_prd002_historical_report_stale_source_quarantine.py             --authority-only             --json
