name: PRD-0.3 Documentation Housekeeping Ratchet Refresh

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/production_readiness/**'
      - 'scripts/roadmap_reconciliation/**'
      - 'scripts/maintenance/**'
      - 'tests/unit/roadmap_reconciliation/**'
      - '.github/workflows/prd003-documentation-housekeeping-ratchet-refresh.yml'
      - 'Makefile'
  workflow_dispatch:

jobs:
  verify-prd003:
    name: Verify PRD-0.3 documentation housekeeping ratchet refresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements/dev.txt
      - name: Compile PRD-0.3 scripts
        run: |
          python3 -m py_compile \
            scripts/production_readiness/audit_prd003_documentation_housekeeping_ratchet_refresh.py \
            scripts/roadmap_reconciliation/capture_prd003_documentation_housekeeping_ratchet_refresh_evidence.py \
            scripts/roadmap_reconciliation/verify_prd003_documentation_housekeeping_ratchet_refresh.py
      - name: Run PRD-0.3 tests
        run: |
          PYTHONPATH=. python3 -m pytest -q \
            tests/unit/roadmap_reconciliation/test_prd003_documentation_housekeeping_ratchet_refresh.py \
            --no-cov
      - name: Verify PRD-0.3 authority
        run: |
          PYTHONPATH=. python3 \
            scripts/roadmap_reconciliation/verify_prd003_documentation_housekeeping_ratchet_refresh.py \
            --authority-only \
            --json
