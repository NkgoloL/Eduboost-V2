name: PRD-0.8 Branch Release Naming Reconciliation

on:
  pull_request:
    branches:
      - master
    paths:
      - "docs/engineering/branching.md"
      - "docs/roadmap/production_readiness/**"
      - "scripts/production_readiness/*prd008*"
      - "scripts/roadmap_reconciliation/*prd008*"
      - "tests/unit/roadmap_reconciliation/test_prd008_branch_release_naming_reconciliation.py"
      - ".github/workflows/prd008-branch-release-naming-reconciliation.yml"
      - "Makefile"
  push:
    branches:
      - master
    paths:
      - "docs/engineering/branching.md"
      - "docs/roadmap/production_readiness/**"
      - "scripts/production_readiness/*prd008*"
      - "scripts/roadmap_reconciliation/*prd008*"
      - "tests/unit/roadmap_reconciliation/test_prd008_branch_release_naming_reconciliation.py"
      - ".github/workflows/prd008-branch-release-naming-reconciliation.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prd008-branch-release-naming-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements/dev.txt

      - name: Verify PRD-0.8 authority
        run: |
          PYTHONPATH=. python3 scripts/roadmap_reconciliation/verify_prd008_branch_release_naming_reconciliation.py --authority-only --json

      - name: Run PRD-0.8 focused tests
        run: |
          PYTHONPATH=. python3 -m pytest -q tests/unit/roadmap_reconciliation/test_prd008_branch_release_naming_reconciliation.py --no-cov
