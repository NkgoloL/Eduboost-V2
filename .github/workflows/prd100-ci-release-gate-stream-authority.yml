name: PRD-1.0 CI Release Gate Stream Authority

on:
  pull_request:
    paths:
      - '.github/workflows/prd100-ci-release-gate-stream-authority.yml'
      - 'docs/engineering/prd1_ci_release_gate_convergence.md'
      - 'docs/roadmap/production_readiness/**'
      - 'scripts/production_readiness/*prd100*'
      - 'scripts/roadmap_reconciliation/*prd100*'
      - 'tests/unit/roadmap_reconciliation/test_prd100_ci_release_gate_stream_authority.py'
      - 'Makefile'
  workflow_dispatch:

jobs:
  prd100-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile PRD-1.0 scripts
        run: |
          python3 -m py_compile             scripts/production_readiness/apply_prd100_ci_release_gate_stream_authority.py             scripts/production_readiness/audit_prd100_ci_release_gate_stream_authority.py             scripts/roadmap_reconciliation/capture_prd100_ci_release_gate_stream_authority_evidence.py             scripts/roadmap_reconciliation/verify_prd100_ci_release_gate_stream_authority.py
      - name: Focused PRD-1.0 tests
        run: |
          PYTHONPATH=. python3 -m pytest -q             tests/unit/roadmap_reconciliation/test_prd100_ci_release_gate_stream_authority.py             --no-cov
      - name: Verify PRD-1.0 authority
        run: |
          PYTHONPATH=. python3             scripts/roadmap_reconciliation/verify_prd100_ci_release_gate_stream_authority.py             --authority-only --json
