name: RR-007 Product Quality Gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  product-quality-gates:
    name: Product quality gate authority
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Audit RR-007 quality-gate anchors and Playwright CI visibility
        run: PYTHONPATH=. python3 scripts/product_quality/audit_rr007_product_quality_gates.py --json

      - name: Verify RR-007 authority
        run: PYTHONPATH=. python3 scripts/roadmap_reconciliation/verify_rr007_product_quality_gates.py --authority-only --json
