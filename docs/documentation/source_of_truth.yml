# EduBoost documentation source-of-truth register
# Generated/installed: 2026-06-22
# Rule: every current topic must have one canonical_path and zero or more related_paths.

version: 1
project: EduBoost V2
owner: documentation-governance
last_reviewed: 2026-06-24
review_interval_days: 30

canonical_sections:
  project_current_state:
    canonical_path: docs/current_state.md
    owner: release-management
    review_interval_days: 14
    evidence_commands:
      - make runtime-check
      - make openapi-check
    related_paths:
      - docs/README.md

  documentation_governance:
    canonical_path: docs/documentation/README.md
    owner: documentation-governance
    review_interval_days: 30
    evidence_commands:
      - make docs-housekeeping-check
    related_paths:
      - docs/documentation/documentation_housekeeping_policy.md
      - docs/documentation/claim_discipline_policy.md
      - docs/documentation/stale_documentation_register.md
      - docs/documentation/stage_3_documentation_housekeeping.md
      - docs/documentation/stage_3_strict_scope.json
      - docs/documentation/stage_4_deep_housekeeping.md
      - docs/documentation/stage_4_strict_scope.json
      - docs/documentation/stage_5_technical_delivery_housekeeping.md
      - docs/documentation/stage_5_strict_scope.json
      - docs/documentation/stage_5_technical_delivery_housekeeping.md
      - docs/documentation/stage_5_strict_scope.json
      - docs/documentation/stage_5_technical_delivery_housekeeping.md
      - docs/documentation/stage_5_strict_scope.json

  source_of_truth_register:
    canonical_path: docs/documentation/source_of_truth.yml
    owner: documentation-governance
    review_interval_days: 30
    evidence_commands:
      - python3 scripts/maintenance/check_doc_source_of_truth.py --root .
    related_paths: []

  product_scope:
    canonical_path: docs/product/README.md
    owner: product
    review_interval_days: 60
    evidence_commands:
      - make docs-housekeeping-check
    related_paths:
      - docs/beta
      - docs/curriculum
      - docs/caps

  architecture:
    canonical_path: docs/architecture/README.md
    owner: architecture
    review_interval_days: 60
    evidence_commands:
      - make runtime-check
      - make openapi-check
    related_paths:
      - docs/adr
      - docs/backend
      - docs/frontend
      - docs/database

  engineering_workflow:
    canonical_path: docs/engineering/README.md
    owner: engineering
    review_interval_days: 45
    evidence_commands:
      - make test-fast
      - make lint
      - make typecheck
    related_paths:
      - docs/development
      - docs/testing

  api_contract:
    canonical_path: docs/api/README.md
    owner: backend
    review_interval_days: 30
    evidence_commands:
      - make openapi-check
      - make route-inventory-check
    related_paths:
      - docs/openapi.json
      - docs/route_inventory.md

  compliance_privacy:
    canonical_path: docs/compliance/README.md
    owner: privacy
    review_interval_days: 45
    evidence_commands:
      - make privacy-boundary-check
    related_paths:
      - docs/popia
      - docs/privacy
      - docs/legal

  security:
    canonical_path: docs/security/README.md
    owner: security
    review_interval_days: 45
    evidence_commands:
      - make environment-security-check
      - make production-secret-placeholder-check
    related_paths:
      - docs/security/runbooks

  operations:
    canonical_path: docs/operations/README.md
    owner: operations
    review_interval_days: 60
    evidence_commands:
      - docker compose config
    related_paths:
      - docs/runbooks
      - docs/observability
      - docs/disaster_recovery
      - deployment
      - k8s

  release_current:
    canonical_path: docs/release/current/README.md
    owner: release-management
    review_interval_days: 14
    evidence_commands:
      - make docs-housekeeping-check
    related_paths:
      - docs/release
      - docs/release-evidence

  generated_documentation:
    canonical_path: docs/generated/README.md
    owner: documentation-governance
    review_interval_days: 30
    evidence_commands:
      - python3 scripts/maintenance/audit_documentation_inventory.py --root . --out-json docs/generated/documentation_inventory.json --out-csv docs/generated/documentation_inventory.csv
    related_paths:
      - docs/generated/documentation_inventory.json
      - docs/generated/documentation_inventory.csv

  frontend_runtime:
    canonical_path: docs/frontend/README.md
    owner: frontend
    review_interval_days: 45
    evidence_commands:
      - make docs-housekeeping-stage5-check
      - cd app/frontend && pnpm run type-check
    related_paths:
      - docs/frontend
      - app/frontend

  backend_runtime:
    canonical_path: docs/backend/README.md
    owner: backend
    review_interval_days: 45
    evidence_commands:
      - make runtime-check
      - make test-fast
    related_paths:
      - app/api_v2.py
      - app/api_v2_routers
      - docs/database

  database_schema:
    canonical_path: docs/database/schema_integrity.md
    owner: database
    review_interval_days: 45
    evidence_commands:
      - python3 scripts/validate_schema_integrity.py
      - python3 scripts/verify_migration_graph.py
    related_paths:
      - alembic
      - app/repositories

  deployment_delivery:
    canonical_path: docs/deployment/README.md
    owner: release-management
    review_interval_days: 45
    evidence_commands:
      - docker compose config
      - docker compose -f docker-compose.prod.yml config
    related_paths:
      - docs/deployment
      - .github/workflows

  testing_quality:
    canonical_path: docs/testing/README.md
    owner: quality
    review_interval_days: 45
    evidence_commands:
      - make test-fast
      - make docs-housekeeping-stage5-check
    related_paths:
      - tests
      - docs/testing

  observability_operations:
    canonical_path: docs/observability/production_observability_architecture_contract.md
    owner: operations
    review_interval_days: 45
    evidence_commands:
      - make docs-housekeeping-stage5-check
    related_paths:
      - docs/observability
      - docs/operations_support

  disaster_recovery:
    canonical_path: docs/disaster_recovery/backup_restore_architecture_contract.md
    owner: operations
    review_interval_days: 45
    evidence_commands:
      - make docs-housekeeping-stage5-check
    related_paths:
      - docs/disaster_recovery
      - docs/disaster_recovery/runbooks

  content_factory:
    canonical_path: docs/content_factory/control_plane.md
    owner: content-factory
    review_interval_days: 45
    evidence_commands:
      - make docs-housekeeping-stage5-check
    related_paths:
      - docs/content_factory
      - data/content_factory

  caps_curriculum:
    canonical_path: docs/curriculum/caps_topic_map_production_contract.md
    owner: curriculum
    review_interval_days: 45
    evidence_commands:
      - make docs-housekeeping-stage5-check
    related_paths:
      - docs/caps
      - docs/curriculum

  diagnostics_learning_science:
    canonical_path: docs/diagnostics/README.md
    owner: diagnostics
    review_interval_days: 45
    evidence_commands:
      - make docs-housekeeping-stage5-check
    related_paths:
      - docs/diagnostics
      - docs/irt
      - docs/learning_science

  ai_safety:
    canonical_path: docs/ai/ai_safety_boundary_contract.md
    owner: ai-safety
    review_interval_days: 45
    evidence_commands:
      - make docs-housekeeping-stage5-check
    related_paths:
      - docs/ai
      - app/services

  archive:
    canonical_path: docs/archive/README.md
    owner: documentation-governance
    review_interval_days: 180
    evidence_commands:
      - make docs-housekeeping-check
    related_paths:
      - docs/documentation/migration_manifests

rules:
  metadata_required_for_active_docs: true
  one_canonical_path_per_topic: true
  archive_not_authoritative_by_default: true
  generated_not_hand_edited: true
  broad_readiness_claims_require_evidence: true
