openapi: 3.1.0
info:
  title: EduBoost SA V2
  description: AI-powered adaptive learning platform — Grade R to 7. CAPS-aligned.
    POPIA-compliant.
  version: 1.0.0-rc1
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v2/health/deep:
    get:
      tags:
      - ops
      summary: Ready
      operationId: ready_api_v2_health_deep_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v2/health/deep:
    get:
      tags:
      - ops
      summary: Ready
      operationId: ready_v2_health_deep_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - ops
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      tags:
      - ops
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v2/admin/curriculum-expansion/coverage/{scope_id}:
    get:
      tags:
      - admin-curriculum-expansion
      summary: Get Scope Coverage
      operationId: get_scope_coverage_api_v2_admin_curriculum_expansion_coverage__scope_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: scope_id
        in: path
        required: true
        schema:
          type: string
          title: Scope Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Scope Coverage Api V2 Admin Curriculum Expansion
                  Coverage  Scope Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/curriculum-expansion/coverage/snapshots:
    post:
      tags:
      - admin-curriculum-expansion
      summary: Capture Snapshots
      operationId: capture_snapshots_api_v2_admin_curriculum_expansion_coverage_snapshots_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageSnapshotRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
                title: Response Capture Snapshots Api V2 Admin Curriculum Expansion
                  Coverage Snapshots Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v2/admin/curriculum-expansion/plans:
    post:
      tags:
      - admin-curriculum-expansion
      summary: Create Expansion Plan
      operationId: create_expansion_plan_api_v2_admin_curriculum_expansion_plans_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpansionPlanRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpansionPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v2/admin/curriculum-expansion/training-manifests:
    post:
      tags:
      - admin-curriculum-expansion
      summary: Create Training Manifest
      operationId: create_training_manifest_api_v2_admin_curriculum_expansion_training_manifests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingManifestCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingManifestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v2/admin/curriculum-expansion/training-manifests/{manifest_id}:
    get:
      tags:
      - admin-curriculum-expansion
      summary: Get Training Manifest
      operationId: get_training_manifest_api_v2_admin_curriculum_expansion_training_manifests__manifest_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: manifest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manifest Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingManifestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/curriculum-expansion/training-manifests/{manifest_id}/decision:
    post:
      tags:
      - admin-curriculum-expansion
      summary: Decide Training Manifest
      operationId: decide_training_manifest_api_v2_admin_curriculum_expansion_training_manifests__manifest_id__decision_post
      security:
      - HTTPBearer: []
      parameters:
      - name: manifest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manifest Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingManifestApproveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingManifestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/curriculum-expansion/training-manifests/{manifest_id}/export:
    post:
      tags:
      - admin-curriculum-expansion
      summary: Export Training Manifest
      operationId: export_training_manifest_api_v2_admin_curriculum_expansion_training_manifests__manifest_id__export_post
      security:
      - HTTPBearer: []
      parameters:
      - name: manifest_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Manifest Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetExportRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingManifestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/ai-operations/budgets/users/{user_id}:
    get:
      tags:
      - admin-ai-operations
      summary: Get User Budget
      operationId: get_user_budget_api_v2_admin_ai_operations_budgets_users__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCounterView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/ai-operations/budgets/tenants/{tenant_id}:
    get:
      tags:
      - admin-ai-operations
      summary: Get Tenant Budget
      operationId: get_tenant_budget_api_v2_admin_ai_operations_budgets_tenants__tenant_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCounterView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/ai-operations/usage:
    get:
      tags:
      - admin-ai-operations
      summary: List Usage
      operationId: list_usage_api_v2_admin_ai_operations_usage_get
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
      - name: purpose
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Purpose
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 744
          minimum: 1
          default: 24
          title: Hours
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageEventView'
                title: Response List Usage Api V2 Admin Ai Operations Usage Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/ai-operations/providers/health:
    get:
      tags:
      - admin-ai-operations
      summary: Provider Health
      operationId: provider_health_api_v2_admin_ai_operations_providers_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProviderHealthView'
                type: array
                title: Response Provider Health Api V2 Admin Ai Operations Providers
                  Health Get
      security:
      - HTTPBearer: []
  /api/v2/admin/ai-operations/reservations:
    get:
      tags:
      - admin-ai-operations
      summary: List Reservations
      operationId: list_reservations_api_v2_admin_ai_operations_reservations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationView'
                title: Response List Reservations Api V2 Admin Ai Operations Reservations
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/admin/ai-operations/reservations/{operation_id}/cancel:
    post:
      tags:
      - admin-ai-operations
      summary: Cancel Reservation
      operationId: cancel_reservation_api_v2_admin_ai_operations_reservations__operation_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          title: Operation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCancelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/assessments:
    get:
      tags:
      - V2 Assessments
      summary: List Assessments
      operationId: list_assessments_api_v2_assessments_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/assessments/{assessment_id}/attempt:
    post:
      tags:
      - V2 Assessments
      summary: Submit Attempt
      operationId: submit_attempt_api_v2_assessments__assessment_id__attempt_post
      security:
      - HTTPBearer: []
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentAttemptRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_api_v2_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v2/auth/register:
    post:
      tags:
      - auth
      summary: Register
      operationId: register_api_v2_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v2_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/auth/dev-session:
    post:
      tags:
      - auth
      summary: Create Dev Session
      description: 'Non-production bootstrap endpoint for the local learner flow.

        Creates or reuses a guardian, learner, and active consent so the frontend

        can exercise authenticated V2 routes without hand-editing localStorage.

        DEV_SESSION_BOOTSTRAPPED'
      operationId: create_dev_session_api_v2_auth_dev_session_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v2/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      operationId: refresh_api_v2_auth_refresh_post
      parameters:
      - name: eduboost_refresh
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Eduboost Refresh
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RefreshRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/auth/sessions:
    get:
      tags:
      - auth
      summary: List Sessions
      description: 'Return active refresh-token sessions for the current user.


        The response intentionally exposes only token metadata, never token values.'
      operationId: list_sessions_api_v2_auth_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v2/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_api_v2_auth_logout_post
      security:
      - HTTPBearer: []
      parameters:
      - name: eduboost_refresh
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Eduboost Refresh
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/auth/revoke-all:
    post:
      tags:
      - auth
      summary: Revoke All Tokens
      operationId: revoke_all_tokens_api_v2_auth_revoke_all_post
      security:
      - HTTPBearer: []
      parameters:
      - name: eduboost_refresh
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Eduboost Refresh
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/auth/forgot-password:
    post:
      tags:
      - auth-extended
      summary: Forgot Password
      description: 'Request a password-reset email.

        Always returns 202 regardless of whether the email exists (OWASP A07

        user-enumeration prevention). Rate-limited to 5 requests / 15 min / IP.'
      operationId: forgot_password_api_v2_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/auth/reset-password:
    post:
      tags:
      - auth-extended
      summary: Reset Password
      description: Consume a password-reset token and update the hashed password.
      operationId: reset_password_api_v2_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/auth/send-verification:
    post:
      tags:
      - auth-extended
      summary: Send Verification
      description: Resend (or send initial) email verification link. Requires auth.
      operationId: send_verification_api_v2_auth_send_verification_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v2/auth/verify-email:
    get:
      tags:
      - auth-extended
      summary: Verify Email
      description: Consume an email-verification token (linked from email).
      operationId: verify_email_api_v2_auth_verify_email_get
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/auth/onboarding:
    get:
      tags:
      - auth-extended
      summary: Get Onboarding
      description: Return current onboarding state. Auto-creates row on first request.
      operationId: get_onboarding_api_v2_auth_onboarding_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v2/auth/onboarding/step:
    patch:
      tags:
      - auth-extended
      summary: Update Onboarding Step
      description: Mark an individual onboarding step complete.
      operationId: update_onboarding_step_api_v2_auth_onboarding_step_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingStepUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v2/auth/onboarding/profile:
    patch:
      tags:
      - auth-extended
      summary: Update Learner Profile
      description: 'Save learner profile data (display name, grade, home language)
        and

        automatically mark the profile_complete onboarding step as done.'
      operationId: update_learner_profile_api_v2_auth_onboarding_profile_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v2/auth/privacy:
    get:
      tags:
      - auth-extended
      summary: Get Privacy Settings
      description: Return current privacy settings. Auto-creates defaults on first
        request.
      operationId: get_privacy_settings_api_v2_auth_privacy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    patch:
      tags:
      - auth-extended
      summary: Update Privacy Settings
      description: Partial-update privacy settings. Only supplied fields are changed.
      operationId: update_privacy_settings_api_v2_auth_privacy_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettingsUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v2/auth/privacy/request-export:
    post:
      tags:
      - auth-extended
      summary: Request Data Export
      description: POPIA section 23 right-of-access — queue a data export job.
      operationId: request_data_export_api_v2_auth_privacy_request_export_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v2/auth/privacy/request-deletion:
    post:
      tags:
      - auth-extended
      summary: Request Account Deletion
      description: POPIA right-to-erasure — soft-flag the account for scheduled deletion.
      operationId: request_account_deletion_api_v2_auth_privacy_request_deletion_post
      responses:
