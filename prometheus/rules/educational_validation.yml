groups:
  - name: educational_validation_alerts
    interval: 60s
    rules:
      - alert: LEVModelCalibrationErrorHigh
        expr: lev_expected_calibration_error > 0.15
        for: 15m
        labels:
          severity: warning
          subsystem: educational_validation
        annotations:
          summary: "Educational Model Expected Calibration Error (ECE) exceeds 0.15"
          description: "Model calibration error on concept {{ $labels.concept_id }} is {{ $value }}, exceeding the acceptable tolerance of 0.15."

      - alert: LEVFalseMasteryRatioSpike
        expr: lev_false_mastery_rate > 0.10
        for: 10m
        labels:
          severity: critical
          subsystem: educational_validation
        annotations:
          summary: "False-mastery classification rate spike detected"
          description: "False-mastery rate reached {{ $value }}, exceeding safety threshold of 0.10. Interventions may be misallocated."

      - alert: LEVMasteryDistributionShift
        expr: lev_population_stability_index > 0.20
        for: 30m
        labels:
          severity: critical
          subsystem: educational_validation
        annotations:
          summary: "Severe educational model population stability drift (PSI >= 0.20)"
          description: "PSI reached {{ $value }} indicating significant concept mastery distribution shift. Automated mastery assertions must be halted."

      - alert: LEVUnauthorizedHighStakesUseAttempt
        expr: increase(lev_unauthorized_use_attempts_total[5m]) > 0
        labels:
          severity: critical
          subsystem: educational_validation_governance
        annotations:
          summary: "Attempted high-stakes automated decision without longitudinal educational validation sign-off"
          description: "An unvalidated high-stakes decision was requested for model {{ $labels.model_version }} in scope {{ $labels.decision_scope }}."
