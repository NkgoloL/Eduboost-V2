[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eduboost"
version = "1.0.0-rc1"
description = "EduBoost V2 backend"
authors = [ { name = "EduBoost Team" } ]
requires-python = ">=3.11"

[tool.setuptools]
packages = { find = {} }

[tool.bandit]
# Skip Low-severity test IDs — all Medium/High findings carry inline # nosec annotations.
# B101=assert_used, B105-107=hardcoded_*password*, B110=try_except_pass,
# B112=try_except_continue, B311=random, B404/B603/B607=subprocess,
# B405=xml.etree, B601=paramiko_calls, B311=random
skips = [
  "B101", "B105", "B106", "B107",
  "B110", "B112",
  "B311",
  "B404", "B405", "B603", "B607",
]
