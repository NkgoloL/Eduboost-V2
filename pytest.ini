# ─────────────────────────────────────────────────────────────────────────────
# pytest.ini — default fast profile (no coverage instrumentation).
#
# Coverage runs: `make test-coverage` or `pytest -c pytest-coverage.ini …`
# PR/local fast gate: `make test-fast` (parallel, excludes governance/slow/llm/e2e)
# ─────────────────────────────────────────────────────────────────────────────

[pytest]
asyncio_mode = auto
testpaths = tests
norecursedirs = .* build dist CVS _darcs {arch} *.egg .venv venv node_modules .hypothesis .pytest_cache
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    --import-mode=importlib

markers =
    unit: fast, isolated unit tests (no I/O)
    integration: tests that require a live DB or Redis
    e2e: end-to-end tests via Playwright (require running stack)
    slow: tests that take >5 seconds
    llm: tests that make real LLM API calls (skipped in CI unless ALLOW_LLM_TESTS=1)
    performance: performance/SLO checks that may require a seeded database or running stack
    smoke: smoke / critical-path tests against a staging or deployed environment
    governance: release/evidence/doc-contract meta-tests (excluded from PR fast gate)
    product: product behaviour tests for real services, routes, DB-backed domain flows, auth, POPIA, billing, learner journeys
    runtime: runtime/stack tests for Postgres, Redis, migrations, schema, /ready, worker, frontend proxy
    advisory: advisory/static tests for Ruff, mypy, Bandit, coverage, dependency audit, route inventory, OpenAPI drift

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Marker examples:
#   make test-fast
#   pytest -m governance
#   pytest -m "not llm and not e2e"
