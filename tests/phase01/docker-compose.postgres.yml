services:
  phase1-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eduboost
      POSTGRES_PASSWORD: phase1-test-password
      POSTGRES_DB: eduboost_phase1_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduboost -d eduboost_phase1_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
