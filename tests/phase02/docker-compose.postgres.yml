services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: phase2
      POSTGRES_PASSWORD: phase2
      POSTGRES_DB: eduboost_phase2_test
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phase2 -d eduboost_phase2_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
