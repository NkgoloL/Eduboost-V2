services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eduboost
      POSTGRES_PASSWORD: phase02r-test-password
      POSTGRES_DB: eduboost_phase02r_test
    ports:
      - "${PHASE02R_POSTGRES_PORT:-55440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduboost -d eduboost_phase02r_test"]
      interval: 2s
      timeout: 3s
      retries: 30
