services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: phase3
      POSTGRES_PASSWORD: phase3
      POSTGRES_DB: eduboost_phase3_test
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phase3 -d eduboost_phase3_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
