services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: phase4
      POSTGRES_PASSWORD: phase4
      POSTGRES_DB: eduboost_phase4_test
    ports:
      - "55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phase4 -d eduboost_phase4_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
