services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: phase5
      POSTGRES_PASSWORD: phase5
      POSTGRES_DB: eduboost_phase5_test
    ports:
      - "55438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phase5 -d eduboost_phase5_test"]
      interval: 2s
      timeout: 3s
      retries: 30
