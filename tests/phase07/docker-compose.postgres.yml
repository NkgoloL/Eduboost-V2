services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eduboost
      POSTGRES_PASSWORD: phase7-test-password
      POSTGRES_DB: eduboost_phase7_test
    ports:
      - "55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduboost -d eduboost_phase7_test"]
      interval: 2s
      timeout: 3s
      retries: 30
